<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasess</title>

    <style>

        /*cuando el mouse se encuentra sobre el elemento, se activa el hover*/
       /*cuando el elemento se encuentra activo, es decir, se le da click, se activa el active*/
       /*cuando el elemento se encuentra enfocado, es decir, se le da click o se le da tab, se activa el focus*/

       div{
        width: 100px;
        height: 100px;
        background-color: red;
        transition-property: width, background-color; /*propiedad a la que se le aplicará la transición*/
        transition-duration: 2s; /*duración de la transición*/
        /*transition-delay: 2s; /*tiempo que tarda en iniciar la transición*/
        /*transition-timing-function: ease; /*función de tiempo que determina la velocidad de la transición*/
        /*transition-timing-function: ease-in-out; /*función de tiempo que determina la velocidad de la transición, en este caso, inicia lenta, luego rápida y luego lenta*/
        /*transition-timing-function: cubic-bezier(0.1, 0.7, 1.0, 0.1); /*función de tiempo que determina la velocidad de la transición, en este caso, inicia lenta, luego rápida y luego lenta, pero con una curva personalizada*/
        transition: width 2s 0s linear; /*propiedad, duración, retraso y función de tiempo de la transición, en este caso, la transición se aplicará a la propiedad width, durará 2 segundos, no tendrá retraso y tendrá una función de tiempo lineal*/
       }

       div:active{
        background-color: blue;
        width: 1000px;
       }

       p{
        color: green;
        font-size: medium;
       }

       p:hover{
        color: orange;
        font-size: large;
       }

       input:focus{
        font-size: large;
        color: red;

       }

    </style>
</head>
<body>

    <div></div>
    <div></div>
    <div></div>
    <div></div>

    <p>Este es un párrafo</p>

    <input type="text">
    <input type="text">
    <input type="text">
    
</body>
</html>
