<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Contenedor Flex</title>

    <style>

        .container{

            display: flex; /*con esta propiedad, los elementos se colocan uno al lado del otro, pero si el espacio no es suficiente, se colocan uno debajo del otro*/
            justify-content: center; /*con esta propiedad, los elementos se centran horizontalmente*/
            flex-direction: row;
            
        
        }
        .elementTitle{
            width: 100%;
            height: 90px;
            background-color: darkgoldenrod;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            padding-top: 35px;
            

        }
        .elementLateral{
            width: 200px;
            height: 100vh;
            background-color: gray;
            font-size: 50px;
            text-align: center;
            padding-top: 50px;
            color:white;
        }
        .elementCenter{
            width: 400px;
            height: 100vh;
            background-color:white;
            font-size: 50px;
            text-align: center;
            padding-top: 50px  ;
        }
    </style>
</head>
<body>

    <div class="elementTitle">Titulo de la Página</div>
    <div class="container">
        <div class="elementLateral" style="flex-grow: 1;">Lateral Izquierdo</div>
        <div class="elementCenter" style="flex-grow: 2;">Zona Central</div>
        <div class="elementLateral" style="flex-grow: 1;">Lateral Derecho</div>
    </div>
    
</body>
</html>
