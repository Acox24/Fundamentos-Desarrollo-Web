<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos JS</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .element {
        width: 50px;
        height: 50px;
        background-color: rgb(252, 0, 0);
        margin: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <button onclick="agregarElemento()">AGREGAR</button>
    <input type="text" id="texto" />

    <h1>Agregar elemento por RGB</h1>
    <label for="">R</label>
    <input type="number" min="0" max="255" id="r" />
    <label for="">G</label>
    <input type="number" min="0" max="255" id="g" />
    <label for="">B</label>
    <input type="number" min="0" max="255" id="b" />

    <br /><br />
    <h1>Agregar elemento por Selector</h1>
    <input type="color" id="colorSelector" />

    <div class="container">
      <!-- Contenedor para los elementos agregados dinámicamente -->
    </div>

    <script>
      const container = document.querySelector(".container");
      const input = document.querySelector("#texto");
      const r = document.querySelector("#r");
      const g = document.querySelector("#g");
      const b = document.querySelector("#b");
      const colorSelector = document.querySelector("#colorSelector");
      let counter = 0;

      function agregarElemento() {
        counter++;

        const element = document.createElement("div");
        element.textContent = input.value || counter;
        element.classList.add("element");

        // LÓGICA DE COLOR
        if (r.value && g.value && b.value) {
          // usar RGB
          element.style.backgroundColor = `rgb(${r.value}, ${g.value}, ${b.value})`;
        } else {
          // usar selector de color
          element.style.backgroundColor = colorSelector.value;
        }
        container.appendChild(element);

        input.value = "";
      }
    </script>
  </body>
</html>
