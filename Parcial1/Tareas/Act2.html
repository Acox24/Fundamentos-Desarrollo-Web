<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de prueba de HTML5</title>
</head>

<body>
    <div id="formulario">
        <form action="" method="get">
            
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="ul">URL</label>
            <input type="url" id="ul" name="ul" placeholder="Escribe la URL de tu página web personal" required><br><br>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required><br><br>

            <label for="tiempo">Tiempo:</label>
            <input type="time" id="tiempo" name="tiempo" required><br><br>

            <label for="fecha y hora">Fecha y Hora:</label>
            <input type="datetime-local" id="fecha y hora" name="fecha y hora" required><br><br>

            <label for="Mes">Mes:</label>
            <input type="month" id="Mes" name="Mes" required><br><br>

            <label for="Semana">Semana:</label>
            <input type="week" id="Semana" name="Semana" required><br><br>

            <label for="Numero">Número:</label>
            <input type="number" id="Numero" name="Numero" min="-10" max="10" required><br><br>

            <label for ="Telefono">Teléfono:</label>
            <input type="tel" id="Telefono" name="Telefono" required><br><br>

            <label for="Color favorito">Color favorito:</label>
            <input type="color" id="Color favorito" name="Color favorito" required><br><br>

            <input type="submit" value="Enviar" name="enviar">


        </form>
    </div>
    
</body>
</html>
